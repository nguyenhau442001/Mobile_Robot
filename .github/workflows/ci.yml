name: ROS2 CI - Build & Test

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu 24.04 / ROS2 Jazzy)
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/Differential_Drive_Mobile_Robot

      # ── 2. Setup ROS2 Jazzy ──────────────────────────────────────────────────
      - name: Setup ROS2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      # ── 3. Install workspace dependencies via rosdep ─────────────────────────
      - name: Install dependencies (rosdep)
        run: |
          source /opt/ros/jazzy/setup.bash
          sudo rosdep init || true
          rosdep update
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro jazzy \
            -y

      # ── 4. Build all packages ─────────────────────────────────────────────────
      - name: colcon build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --event-handlers console_cohesion+
        env:
          COLCON_EXTENSION_BLACKLIST: colcon_notification

      # ── 5. Run tests ──────────────────────────────────────────────────────────
      - name: colcon test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test \
            --event-handlers console_cohesion+ \
            --return-code-on-test-failure

      # ── 6. Show test results ──────────────────────────────────────────────────
      - name: colcon test-result
        if: always()
        run: |
          colcon test-result --verbose || true
