name: Build & Test

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

jobs:
  ubuntu:
    name: Ubuntu 24.04 / ROS2 Jazzy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/Differential_Drive_Mobile_Robot

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy --skip-keys "ament_python" -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release --event-handlers console_cohesion+
        env:
          COLCON_EXTENSION_BLACKLIST: colcon_notification

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure

      - name: Test results
        if: always()
        run: colcon test-result --verbose || true

  macos:
    name: macOS / ROS2 Jazzy (RoboStack)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/Differential_Drive_Mobile_Robot

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: robostack-jazzy,conda-forge
          channel-priority: strict

      - name: Create ROS 2 Jazzy environment
        run: |
          conda create -n ros2_jazzy -y --quiet \
            --channel robostack-jazzy \
            --channel conda-forge \
            python=3.12 \
            ros-jazzy-desktop \
            ros-jazzy-nav2-bringup \
            ros-jazzy-slam-toolbox \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-joint-state-publisher \
            ros-jazzy-ros-gz \
            ros-jazzy-ros-gz-bridge \
            colcon-common-extensions \
            colcon-ros

      - name: Build
        run: |
          conda run -n ros2_jazzy bash -c "
            source \"\$CONDA_PREFIX/setup.sh\"
            cd \$GITHUB_WORKSPACE
            colcon build \
              --cmake-args -DCMAKE_BUILD_TYPE=Release \
              --event-handlers console_cohesion+
          "

      - name: Test
        run: |
          conda run -n ros2_jazzy bash -c "
            source \"\$CONDA_PREFIX/setup.sh\"
            source install/setup.bash
            cd \$GITHUB_WORKSPACE
            colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          "

      - name: Test results
        if: always()
        run: |
          conda run -n ros2_jazzy bash -c "
            cd \$GITHUB_WORKSPACE
            colcon test-result --verbose || true
          "
