# ──────────────────────────────────────────────────────────────────────────────
# CascadedController tuning
# ──────────────────────────────────────────────────────────────────────────────
#
# Control architecture
# --------------------
#
# The controller uses two nested feedback loops:
#
#   Outer loop (position control)
#
#     distance_error
#           ↓
#     v_setpoint = clamp(
#         k_linear * distance_error,
#         max_linear_velocity)
#
#     heading_error
#           ↓
#     ω_setpoint = clamp(
#         k_angular * heading_error,
#         max_angular_velocity)
#
#
#   Inner loop (velocity control)
#
#     linear_velocity_error =
#         v_setpoint - measured_linear_velocity
#
#     angular_velocity_error =
#         ω_setpoint - measured_angular_velocity
#
#     linear_cmd =
#         rate_limit(
#             previous_linear_cmd +
#             k_vel_linear * linear_velocity_error)
#
#     angular_cmd =
#         rate_limit(
#             previous_angular_cmd +
#             k_vel_angular * angular_velocity_error)
#
#
# Robot geometry
# --------------
#
#   Wheel radius      : 0.065 m
#   Wheel separation  : 0.300 m
#
# ──────────────────────────────────────────────────────────────────────────────
cascaded_controller:
  ros__parameters:

    # Proportional gains
    k_linear:   0.5       # gain on distance error        → linear.x
    k_angular:  2.0       # gain on heading error         → angular.z
    k_vel_linear:   0.2   # gain on linear vel error
    k_vel_angular:  0.5   # gain on angular vel error

    # Velocity caps [m/s] / [rad/s]  (symmetric, applied as ±limit)
    max_linear_velocity:   5.0     # forward speed cap
    max_angular_velocity:  33.33   # turn rate cap (kinematic limit)

    # Acceleration limits (asymmetric: gentle ramp-up, aggressive braking)
    max_linear_acceleration:   1.0     # m/s²   (0 → 5 m/s in 5 s)
    min_linear_deceleration:  -5.0     # m/s²   (5 → 0 m/s in 1 s)
    max_angular_acceleration:  6.67    # rad/s²  (+2 × 1.0 / 0.3)
    min_angular_deceleration: -33.33   # rad/s²  (-2 × 5.0 / 0.3)
